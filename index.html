# Penggunaan non-interaktif (mis. curl URL | bash):
#
#   curl -fsSL URL | bash -s -- -y
#   curl -fsSL URL | INCLUDE_SYSTEM_APPS=true INSTALL_NENE=true bash
#
# Opsi:
#   -y, --yes    Lewati semua prompt, pakai default aman
#                (hanya app user, nene tidak diinstal)
#
# Variabel lingkungan (true/false):
#   INCLUDE_SYSTEM_APPS   ikutkan aplikasi sistem
#   INSTALL_NENE          instal nene (menimpa termux-url-opener)
#--------------------------------------------------------------------------------

termux-wake-lock
BOOT_MODE=false
ASSUME_YES=false
INCLUDE_SYSTEM_APPS="${INCLUDE_SYSTEM_APPS:-}"
INSTALL_NENE="${INSTALL_NENE:-}"

for arg in "$@"; do
    case "$arg" in
        -y|--yes) ASSUME_YES=true ;;
    esac
done

SCRIPT_DIR="$(CDPATH='' cd -- "$(dirname -- "$0")" && pwd -P)"

if [ "$SCRIPT_DIR" = "$HOME/.termux/boot" ]; then
    BOOT_MODE=true
fi

toast() {
    [ "$BOOT_MODE" = true ] && command -v termux-toast >/dev/null 2>&1 &&
        termux-toast "$*" >> "$HOME"/.drawercli-aurora-boot.log
}

status() {
    printf '%s\n' "$*"
    toast "$*"
}

# Pastikan ~/bin ada dan PATH-nya tertulis di ~/.bashrc (tanpa duplikat)
ensure_path() {
    mkdir -p "$HOME/bin"
    touch "$HOME/.bashrc"
    if grep -qxF 'export PATH="$HOME/bin:$PATH"' "$HOME/.bashrc"; then
        status 'Info: PATH ~/bin already in ~/.bashrc, nothing changed'
    else
        echo 'export PATH="$HOME/bin:$PATH"' >> "$HOME/.bashrc"
        status '✓ Added ~/bin to PATH in ~/.bashrc (active on next terminal session)'
    fi
    export PATH="$HOME/bin:$PATH"
}

# Tanya pengguna lewat /dev/tty; jika tidak ada tty, jawaban kosong (= default N)
ask() {
    printf '%s\n' "$1"
    REPLY=""
    if [ -r /dev/tty ]; then
        read -r REPLY < /dev/tty
    fi
}

ask_to_adding_sys_apps() {

    if [ "$BOOT_MODE" = true ]; then
        INCLUDE_SYSTEM_APPS=true
        toast "Boot mode: extracting all apps"
        return 0
    fi

    # Sudah ditentukan lewat variabel lingkungan
    case "$INCLUDE_SYSTEM_APPS" in
        true)
            status '(auto) extracting system apps..'
            return 0
            ;;
        false)
            status '(auto) skipping system apps (user apps only)'
            return 0
            ;;
    esac

    # Mode -y: default aman
    if [ "$ASSUME_YES" = true ]; then
        INCLUDE_SYSTEM_APPS=false
        status '(auto) skipping system apps (user apps only)'
        return 0
    fi

    ask 'Include system applications in extraction? [y/N]'

    case "$REPLY" in
        y|Y) INCLUDE_SYSTEM_APPS=true ;;
        *)   INCLUDE_SYSTEM_APPS=false ;;
    esac
}

ask_to_install_nene() {

    target="$HOME/bin/nene-hook.sh"
    source_url="https://raw.githubusercontent.com/luisadha/nene/refs/heads/main/bin/nene"
    nene_auto=false

    if [ -f "$target" ]; then
        status 'Info: nene already installed, skipping'
        return 0
    fi

    if [ "$BOOT_MODE" = true ]; then
        toast "Boot mode: skipping nene installation"
        return 0
    fi

    case "$INSTALL_NENE" in
        true|false)
            nene_auto=true
            ;;
        *)
            if [ "$ASSUME_YES" = true ]; then
                INSTALL_NENE=false
                nene_auto=true
            else
                ask 'Install nene to enable future app list updates via sharing feature? [y/N]:'
                case "$REPLY" in
                    y|Y) INSTALL_NENE=true ;;
                    *)   INSTALL_NENE=false ;;
                esac
            fi
            ;;
    esac

    if [ "$INSTALL_NENE" != true ]; then
        [ "$nene_auto" = true ] && status '(auto) skipping nene installation'
        return 0
    fi

    if [ "$nene_auto" = true ]; then
        status '(auto) installing nene..'
    else
        status 'Info: installing nene..'
    fi

    if mkdir -p "$HOME/bin" &&
       curl -fsSL -o "$target" "$source_url" &&
       chmod +x "$target" &&
       cp -f "$target" "$HOME/bin/termux-url-opener"; then

        status '✓ nene installation successful!'
    else
        rm -f "$target"
        status '× nene installation failed! Check your internet connection.'
    fi
}

latest_anihillation_gists="https://gist.githubusercontent.com/luisadha/702967e776e0efb8385ab31adda78715/raw/annihilation.sh"

status 'Info: Checking Termux widget ..'

if [ "$(pm list package --user 0 2>&1 </dev/null | grep com.termux.widget | sed 's/^package://')" = "com.termux.widget" ]; then
    mkdir -p "$HOME/.shortcuts/"
    printf '✓ Requirement satisfied\n\n'
    toast '✓ Requirement satisfied'
else
    printf '× Addon Termux:Widget not installed on your phone!\n'
    toast '× Addon Termux:Widget not installed on your phone!'

    exit 2
fi

status 'Info: Processing backup...'
backup_dir="$HOME/.shortcuts/.backup-old-shortcut"
mkdir -p "$backup_dir"
find "$HOME/.shortcuts" -maxdepth 1 -type f -exec cp -p {} "$backup_dir"/ \;
printf '✓ Backup done %s\n\n' "$backup_dir"
toast '✓ Backup done'

status 'Info: Installing dependencies..'
mkdir -p "$PREFIX/bin"
printf '\n'
DEBIAN_FRONTEND=noninteractive pkg install -y aapt
printf '\n'

# wget tetap prioritas, tanpa ubah redirection
if command -v wget >/dev/null 2>&1; then
    wget -qO "$PREFIX/bin/annihilation" "$latest_anihillation_gists"
elif command -v curl >/dev/null 2>&1; then
    curl -fsSL -o "$PREFIX/bin/annihilation" "$latest_anihillation_gists"
else
    printf 'Error: neither wget nor curl found!\n' >&2
    toast 'Error: neither wget nor curl found!'
    exit 1
fi

chmod +x "$PREFIX/bin/annihilation"
printf '✓ Installed %s/annihilation\n\n' "$PREFIX/bin"
toast '✓ Installed annihilation'

ensure_path
ask_to_install_nene

printf '\nInfo: Clean up before installs\n'
toast 'Info: Clean up before installs'
printf '\n\n'

ask_to_adding_sys_apps
printf '\n'

# Gunakan string biasa (bukan array) agar kompatibel dengan sh/dash
pm_flags=""
if [ "$INCLUDE_SYSTEM_APPS" = false ]; then
    pm_flags="-3"
    printf 'Info: Now extracting your user-installed apps..\n'
else
    status 'Info: Now extracting your installed apps..'
fi
printf '\n'

# $pm_flags sengaja tanpa kutip agar kosong = tidak ada argumen
pm list packages --user 0 $pm_flags 2>&1 </dev/null | while IFS= read -r line; do
    pkg=${line#package:}

    activity=$(pm resolve-activity --user 0 \
        -a android.intent.action.MAIN \
        -c android.intent.category.LAUNCHER \
        "$pkg" 2>&1 </dev/null | grep "name=" | head -n1 | sed 's/.*name=//')

    apk_path=$(pm path "$pkg" --user 0 2>&1 </dev/null | sed 's/package://; q' )

    label=$(aapt dump badging "$apk_path" 2>/dev/null |
        grep "application-label:" |
        sed "s/.*application-label:'//; s/'//")

    if [ -n "$activity" ] && [ -n "$label" ]; then
        printf 'am start --user 0 -n "%s/%s"\n' "$pkg" "$activity" > "$HOME/.shortcuts/$label"
    fi
done

rm -f "$HOME"/.shortcuts/Termux
printf '%s\n%s\n' \
'am start --user 0 -n com.termux/.app.TermuxActivity' \
'read _' \
> "$HOME/.shortcuts/Termux"

printf '✓ All process completed, list apps saved at %s/.shortcuts\n' "$HOME"
toast '✓ All process completed, list apps saved at ~/.shortcuts'

termux-wake-unlock
